  <body>
    <div id="root"></div>

    <!--
      Hidden static form for Netlify Forms detection.
      Netlify's build bots scan the built HTML for a plain <form> with
      data-netlify="true" to register the form endpoint, since the real
      form is rendered client-side by React. Keep the "name" and every
      field "name" attribute here in sync with src/components/QuoteForm.jsx.
      If you switch to Formspree or another backend, this block can be removed.
    -->
    <form name="quote-request" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="vehicleYear" />
      <input type="text" name="vehicleMake" />
      <input type="text" name="vehicleModel" />
      <input type="text" name="vehicleType" />
      <input type="text" name="vehicleCondition" />
      <input type="text" name="services" />
      <input type="text" name="preferredDate" />
      <input type="text" name="preferredTime" />
      <input type="text" name="address" />
      <textarea name="notes"></textarea>
      <input type="text" name="company" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
